{{- if .Values.components.prerequisites.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-prerequisites
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}components/prerequisites
    helm:
      valuesObject:
        namespace: {{ .Values.tpaNamespace }}
        objectBucketClaim:
          name: {{ .Values.components.prerequisites.objectBucketClaim.name }}
          bucketName: {{ .Values.components.prerequisites.objectBucketClaim.bucketName }}
          storageClassName: {{ .Values.components.prerequisites.objectBucketClaim.storageClassName }}
        oidc:
          clientSecret: {{ .Values.components.prerequisites.oidc.clientSecret | quote }}
        tpaRouteHost: tpa.{{ .Values.deployer.domain }}
        keycloak:
          namespace: {{ .Values.components.prerequisites.keycloak.namespace }}
          realmImport:
            name: {{ .Values.components.prerequisites.keycloak.realmImport.name }}
            keycloakCRName: {{ .Values.components.prerequisites.keycloak.realmImport.keycloakCRName }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.tpaNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.postgresql.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-postgresql
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}components/postgresql
    helm:
      valuesObject:
        namespace: {{ .Values.tpaNamespace }}
        credentials:
          dbHost: {{ .Values.components.postgresql.credentials.dbHost | quote }}
          dbName: {{ .Values.components.postgresql.credentials.dbName | quote }}
          dbUser: {{ .Values.components.postgresql.credentials.dbUser | quote }}
          dbPassword: {{ .Values.components.postgresql.credentials.dbPassword | quote }}
          dbAdmin: {{ .Values.components.postgresql.credentials.dbAdmin | quote }}
          dbAdminPassword: {{ .Values.components.postgresql.credentials.dbAdminPassword | quote }}
          dbPort: {{ .Values.components.postgresql.credentials.dbPort | quote }}
        storage:
          size: {{ .Values.components.postgresql.storage.size }}
        image: {{ .Values.components.postgresql.image }}
        tuning:
          maxWalSize: {{ .Values.components.postgresql.tuning.maxWalSize | quote }}
          minWalSize: {{ .Values.components.postgresql.tuning.minWalSize | quote }}
          walBuffers: {{ .Values.components.postgresql.tuning.walBuffers | quote }}
          maintenanceWorkMem: {{ .Values.components.postgresql.tuning.maintenanceWorkMem | quote }}
          workMem: {{ .Values.components.postgresql.tuning.workMem | quote }}
          sharedBuffers: {{ .Values.components.postgresql.tuning.sharedBuffers | quote }}
          effectiveCacheSize: {{ .Values.components.postgresql.tuning.effectiveCacheSize | quote }}
        resources:
          limits:
            memory: {{ .Values.components.postgresql.resources.limits.memory }}
            cpu: {{ .Values.components.postgresql.resources.limits.cpu }}
          requests:
            memory: {{ .Values.components.postgresql.resources.requests.memory }}
            cpu: {{ .Values.components.postgresql.resources.requests.cpu }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.tpaNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.tpaServer.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-server
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: https://charts.openshift.io/
    chart: redhat-trusted-profile-analyzer
    targetRevision: {{ .Values.components.tpaServer.chartVersion | quote }}
    helm:
      valuesObject:
        openshift:
          enabled: true
        appDomain: -{{ .Values.tpaNamespace }}.{{ .Values.deployer.domain }}
        ingress:
          className: {{ .Values.components.tpaServer.ingress.className }}
          additionalAnnotations:
            {{- toYaml .Values.components.tpaServer.ingress.additionalAnnotations | nindent 12 }}
        storage:
          type: s3
          region: https://s3-openshift-storage.{{ .Values.deployer.domain }}:443
          bucket: {{ .Values.components.prerequisites.objectBucketClaim.bucketName }}
          accessKey:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.components.prerequisites.objectBucketClaim.name }}
                key: AWS_ACCESS_KEY_ID
          secretKey:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.components.prerequisites.objectBucketClaim.name }}
                key: AWS_SECRET_ACCESS_KEY
        database:
          host:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.host
          port:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.port
          name:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.name
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.user
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.password
        createDatabase:
          name:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.name
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.admin
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.adminpassword
        migrateDatabase:
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.admin
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.adminpassword
        modules:
          createDatabase:
            enabled: {{ .Values.components.tpaServer.modules.createDatabase.enabled }}
          migrateDatabase:
            enabled: {{ .Values.components.tpaServer.modules.migrateDatabase.enabled }}
          createImporters:
            {{- toYaml .Values.components.tpaServer.modules.createImporters | nindent 12 }}
        oidc:
          issuerUrl: https://{{ .Values.components.tpaServer.ssoHostnamePrefix }}.{{ .Values.deployer.domain }}/realms/{{ .Values.components.tpaServer.oidc.realmName }}
          clients:
            frontend:
              clientId: {{ .Values.components.tpaServer.oidc.clients.frontend.clientId }}
            cli:
              clientId: {{ .Values.components.tpaServer.oidc.clients.cli.clientId }}
              clientSecret:
                valueFrom:
                  secretKeyRef:
                    name: oidc-cli
                    key: client-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.tpaNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.demoDataset.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-demo-dataset
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}components/demo-dataset
    helm:
      valuesObject:
        namespace: {{ .Values.tpaNamespace }}
        datasetUrl: {{ .Values.components.demoDataset.datasetUrl | quote }}
        tpaServerUrl: https://tpa.{{ .Values.deployer.domain }}
        keycloakTokenUrl: https://{{ .Values.components.tpaServer.ssoHostnamePrefix }}.{{ .Values.deployer.domain }}/realms/{{ .Values.components.tpaServer.oidc.realmName }}/protocol/openid-connect/token
        clientId: {{ .Values.components.tpaServer.oidc.clients.cli.clientId }}
        image: {{ .Values.components.demoDataset.image }}
        dbMonitor:
          enabled: {{ .Values.components.demoDataset.dbMonitor.enabled }}
          image: {{ .Values.components.demoDataset.dbMonitor.image }}
          routeHost: tpa-db-monitor.{{ .Values.deployer.domain }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.tpaNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.rhdaBackend.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-rhda-backend
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}components/rhda-backend
    helm:
      valuesObject:
        namespace: {{ .Values.components.rhdaBackend.namespace }}
        image: {{ .Values.components.rhdaBackend.image }}
        initImage: {{ .Values.components.rhdaBackend.initImage }}
        resources:
          limits:
            memory: {{ .Values.components.rhdaBackend.resources.limits.memory }}
            cpu: {{ .Values.components.rhdaBackend.resources.limits.cpu | quote }}
          requests:
            memory: {{ .Values.components.rhdaBackend.resources.requests.memory }}
            cpu: {{ .Values.components.rhdaBackend.resources.requests.cpu }}
        tpaInternalUrl: https://server.{{ .Values.tpaNamespace }}.svc:443
        tpaExternalUrl: https://tpa.{{ .Values.deployer.domain }}
        oidc:
          clientId: {{ .Values.components.tpaServer.oidc.clients.cli.clientId }}
          clientSecret: {{ .Values.components.prerequisites.oidc.clientSecret | quote }}
          issuerUrl: https://{{ .Values.components.tpaServer.ssoHostnamePrefix }}.{{ .Values.deployer.domain }}/realms/{{ .Values.components.tpaServer.oidc.realmName }}
        branding:
          displayName: {{ .Values.components.rhdaBackend.branding.displayName | quote }}
          exploreTitle: {{ .Values.components.rhdaBackend.branding.exploreTitle | quote }}
          exploreDescription: {{ .Values.components.rhdaBackend.branding.exploreDescription | quote }}
        postgresql:
          image: {{ .Values.components.rhdaBackend.postgresql.image }}
          storage: {{ .Values.components.rhdaBackend.postgresql.storage }}
          database: {{ .Values.components.rhdaBackend.postgresql.database }}
          username: {{ .Values.components.rhdaBackend.postgresql.username }}
          password: {{ .Values.components.rhdaBackend.postgresql.password | quote }}
        redis:
          image: {{ .Values.components.rhdaBackend.redis.image }}
          storage: {{ .Values.components.rhdaBackend.redis.storage }}
        routeHost: rhda.{{ .Values.deployer.domain }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.rhdaBackend.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.userinfoDashboard.enabled }}
{{- $uiRouteHost := printf "demo-instructions.%s" .Values.deployer.domain }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.fieldContentName }}-userinfo-dashboard
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: tpa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}components/userinfo-dashboard
    helm:
      valuesObject:
        namespace: {{ .Values.components.userinfoDashboard.namespace }}
        image: {{ .Values.components.userinfoDashboard.image }}
        routeHost: {{ $uiRouteHost }}
        consoleLink:
          section: {{ .Values.components.userinfoDashboard.consoleLink.section | quote }}
          text: {{ .Values.components.userinfoDashboard.consoleLink.text | quote }}
          iconUrl: {{ .Values.components.userinfoDashboard.consoleLink.iconUrl | default (printf "https://%s/static/demo-icon.png" $uiRouteHost) | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.userinfoDashboard.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
