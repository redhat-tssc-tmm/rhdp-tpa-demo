fieldContentName: tpa
tpaNamespace: trusted-profile-analyzer

gitops:
  repoUrl: "https://github.com/redhat-tssc-tmm/rhdp-tpa-demo.git"
  revision: "feat/tpa-pre-release"
  basePath: ""

argocd:
  namespace: openshift-gitops
  project: default

components:
  prerequisites:
    enabled: true
    objectBucketClaim:
      name: tpa-bucket-claim
      bucketName: tpa-bucket
      storageClassName: openshift-storage.noobaa.io
    oidc:
      clientSecret: "SuTQThQk-68Lu-d7U1-R0co-ze2DBZ9EDPxP"
    keycloak:
      namespace: keycloak
      realmImport:
        name: tssc-sso-realm-import
        keycloakCRName: keycloak

  postgresql:
    enabled: true
    credentials:
      dbHost: "tpa-postgresql"
      dbName: "tpadb"
      dbUser: "tpauser"
      dbPassword: "r3dh8t1!"
      dbAdmin: "postgres"
      dbAdminPassword: "adminr3dh8t1!"
      dbPort: "5432"
    storage:
      size: 30Gi
    image: registry.redhat.io/rhel10/postgresql-18
    tuning:
      maxWalSize: "4GB"
      minWalSize: "512MB"
      walBuffers: "64MB"
      maintenanceWorkMem: "256MB"
      workMem: "2MB"
      sharedBuffers: "512MB"
      effectiveCacheSize: "2GB"
      maxConnections: 200
    resources:
      limits:
        memory: 6Gi
        cpu: 2
      requests:
        memory: 2Gi
        cpu: 500m

  tpaServer:
    enabled: true
    # "*" deploys the latest available version from charts.openshift.io
    # Pin to a specific version (e.g. "3.1.0") for reproducible deployments
    chartVersion: "*"
    image:
      fullName: quay.io/ruben/rhtpa-lwn-demo:latest
      pullPolicy: Always
    ssoHostnamePrefix: sso
    oidc:
      realmName: tssc-sso
      clients:
        frontend:
          clientId: tpa-frontend
        cli:
          clientId: tpa-cli
    ingress:
      className: openshift-default
      additionalAnnotations:
        haproxy.router.openshift.io/timeout: "5m"
    modules:
      createDatabase:
        enabled: true
      migrateDatabase:
        enabled: true
      createImporters:
        enabled: true
        importers:
          redhat-sboms:
            sbom:
              description: All Red Hat SBOMs
              period: 1d
              source: https://access.redhat.com/security/data/sbom/beta/
              keys:
                - https://access.redhat.com/security/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
              disabled: true
              fetchRetries: 50
          redhat-csaf:
            csaf:
              description: All Red Hat CSAF data
              period: 1d
              source: redhat.com
              disabled: true
              fetchRetries: 50
          cve:
            cve:
              description: CVE list v5
              period: 1d
              source: https://github.com/CVEProject/cvelistV5
              disabled: true
          osv-github:
            osv:
              description: GitHub Advisory Database
              period: 1d
              source: https://github.com/github/advisory-database
              path: advisories
              disabled: true
          quay-redhat-user-workloads:
            quay:
              description: SBOMs from build image attachments
              period: 1d
              source: quay.io
              namespace: redhat-user-workloads
              disabled: true

  demoDataset:
    enabled: false
    datasetUrl: "https://raw.githubusercontent.com/redhat-tssc-tmm/rhdp-tpa-demo/main/datasets/tpa-demo-dataset-v2.zip"
    image: registry.redhat.io/ubi9/ubi
    dbMonitor:
      enabled: true
      image: quay.io/tssc_demos/tpa-db-monitor:latest

  rhdaBackend:
    enabled: true
    namespace: rhda-backend
    image: quay.io/ruben/rhda-lwn-demo@sha256:28269d02d5bd70296cc7160b62a58c139b1eb0ecba62b7068b97584b85f12ce9
    initImage: registry.redhat.io/ubi9/openjdk-21-runtime:1.23
    resources:
      limits:
        memory: 2Gi
        cpu: "1"
      requests:
        memory: 1Gi
        cpu: 250m
    branding:
      displayName: "Red Hat Trusted Profile Analyzer"
      exploreTitle: "Open your Red Hat Trusted Profile Analyzer"
      exploreDescription: "Red Hat Trusted Profile Analyzer helps organizations manage SBOMs, vulnerability advisories, and VEX data."
    postgresql:
      image: registry.redhat.io/rhel10/postgresql-18
      storage: 1Gi
      database: trustify_da
      username: trustify_da
      password: "r3dh8t1!"
    redis:
      image: registry.redhat.io/rhel9/redis-7:latest
      storage: 1Gi

  userinfoDashboard:
    enabled: true
    namespace: rhdp-userinfo
    image: quay.io/tssc_demos/rhdp-userinfo:latest
    consoleLink:
      section: "Demo Platform"
      text: "Instructions"
      iconUrl: ""

deployer:
  domain: ""
  apiUrl: ""
