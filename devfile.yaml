schemaVersion: 2.3.0
metadata:
  name: tpa-demo
  displayName: TPA Demo Workspace
components:
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      cpuLimit: "2"
      mountSources: true
events:
  postStart:
    - configure-rhda
commands:
  - id: configure-rhda
    exec:
      component: dev-tools
      commandLine: |
        CLUSTER_DOMAIN=$(echo "$CLUSTER_CONSOLE_URL" | sed 's|https://console-openshift-console\.||')
        RHDA_URL="https://rhda.${CLUSTER_DOMAIN}"
        USER_SETTINGS="/checode/remote/data/User/settings.json"
        if [ -f "$USER_SETTINGS" ]; then
          python3 -c "
        import json
        with open('${USER_SETTINGS}') as f:
            d = json.load(f)
        d['redHatDependencyAnalytics.backendUrl'] = '${RHDA_URL}'
        with open('${USER_SETTINGS}', 'w') as f:
            json.dump(d, f, indent=4)
        "
        else
          mkdir -p "$(dirname "$USER_SETTINGS")"
          printf '{\"redHatDependencyAnalytics.backendUrl\": \"%s\"}\n' "$RHDA_URL" > "$USER_SETTINGS"
        fi
