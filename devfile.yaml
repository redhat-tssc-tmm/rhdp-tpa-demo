schemaVersion: 2.3.0
metadata:
  name: tpa-demo
  displayName: TPA Demo Workspace
components:
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      cpuLimit: "2"
      mountSources: true
events:
  postStart:
    - configure-rhda
commands:
  - id: configure-rhda
    exec:
      component: dev-tools
      commandLine: |
        CLUSTER_DOMAIN=$(echo "$CLUSTER_CONSOLE_URL" | sed 's|https://console-openshift-console\.||')
        RHDA_URL="https://rhda.${CLUSTER_DOMAIN}"
        echo ""
        echo "============================================================"
        echo "  RHDA Plugin Configuration Required"
        echo "============================================================"
        echo ""
        echo "  Set the backend URL in VS Code:"
        echo ""
        echo "  1. Press Ctrl+Shift+P"
        echo "  2. Type: Open User Settings (JSON)"
        echo "  3. Add this line:"
        echo ""
        echo "     \"redHatDependencyAnalytics.backendUrl\": \"${RHDA_URL}\""
        echo ""
        echo "  Or alternatively:"
        echo ""
        echo "  1. Press Ctrl+Shift+P"
        echo "  2. Type: Open Settings (UI)"
        echo "  3. Search for: redHatDependencyAnalytics.backendUrl"
        echo "  4. Change the Backend Url value to:"
        echo "     ${RHDA_URL}"
        echo ""
        echo "  Then open any pom.xml to trigger a scan."
        echo "============================================================"
        echo ""
