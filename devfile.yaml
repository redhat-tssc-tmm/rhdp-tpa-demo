schemaVersion: 2.3.0
metadata:
  name: tpa-demo
  displayName: TPA Demo Workspace
components:
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      cpuLimit: "2"
      mountSources: true
events:
  postStart:
    - configure-rhda
commands:
  - id: configure-rhda
    exec:
      component: dev-tools
      commandLine: |
        if [ -n "$RHDA_BACKEND_URL" ]; then
          SETTINGS_FILE="${PROJECT_SOURCE}/.vscode/settings.json"
          mkdir -p "$(dirname "$SETTINGS_FILE")"
          if [ -f "$SETTINGS_FILE" ]; then
            python3 -c "
        import json
        with open('${SETTINGS_FILE}') as f:
            d = json.load(f)
        d['redHatDependencyAnalytics.backendUrl'] = '${RHDA_BACKEND_URL}'
        with open('${SETTINGS_FILE}', 'w') as f:
            json.dump(d, f, indent=4)
        "
          else
            echo '{\"redHatDependencyAnalytics.backendUrl\": \"'${RHDA_BACKEND_URL}'\"}' > "$SETTINGS_FILE"
          fi
        fi
