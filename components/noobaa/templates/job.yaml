---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noobaa-installer
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: noobaa-installer
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "secrets", "configmaps", "pods", "serviceaccounts", "persistentvolumeclaims", "endpoints", "events"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["noobaa.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["objectbucket.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["*"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["use", "get", "list", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
  - apiGroups: ["postgresql.cnpg.noobaa.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["cloudcredential.openshift.io"]
    resources: ["credentialsrequests"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:nonroot-v2:noobaa
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["nonroot-v2"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noobaa-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2:noobaa
subjects:
  - kind: ServiceAccount
    name: cnpg-manager
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: noobaa
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: noobaa-endpoint
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: noobaa-core
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noobaa-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noobaa-installer
subjects:
  - kind: ServiceAccount
    name: noobaa-installer
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: noobaa-installer
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: noobaa-installer
      restartPolicy: Never
      containers:
        - name: install
          image: {{ .Values.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              STORAGE_CLASS="openshift-storage.noobaa.io"
              NAMESPACE="{{ .Values.namespace }}"
              API_SERVER="https://kubernetes.default.svc"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              kube_get() {
                curl -s -o /dev/null -w "%{http_code}" \
                  --cacert "$CACERT" \
                  -H "Authorization: Bearer $TOKEN" \
                  "${API_SERVER}${1}"
              }

              kube_patch() {
                local path="$1"
                local data="$2"
                curl -s --cacert "$CACERT" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/merge-patch+json" \
                  -X PATCH "${API_SERVER}${path}" \
                  -d "$data"
              }

              patch_noobaa_resources() {
                echo "Patching NooBaa CR with tuned resource limits..."
                kube_patch "/apis/noobaa.io/v1alpha1/namespaces/${NAMESPACE}/noobaas/noobaa" '{
                  "spec": {
                    "endpoints": {
                      "resources": {
                        "requests": {"cpu": "{{ .Values.resources.endpoints.requests.cpu }}", "memory": "{{ .Values.resources.endpoints.requests.memory }}"},
                        "limits":   {"cpu": "{{ .Values.resources.endpoints.limits.cpu }}",   "memory": "{{ .Values.resources.endpoints.limits.memory }}"}
                      }
                    },
                    "coreResources": {
                      "requests": {"cpu": "{{ .Values.resources.core.requests.cpu }}", "memory": "{{ .Values.resources.core.requests.memory }}"},
                      "limits":   {"cpu": "{{ .Values.resources.core.limits.cpu }}",   "memory": "{{ .Values.resources.core.limits.memory }}"}
                    }
                  }
                }' > /dev/null
                echo "NooBaa resources patched."
              }

              SC_STATUS=$(kube_get "/apis/storage.k8s.io/v1/storageclasses/$STORAGE_CLASS")
              BS_STATUS=$(kube_get "/apis/noobaa.io/v1alpha1/namespaces/$NAMESPACE/backingstores/noobaa-default-backing-store")
              if [ "$SC_STATUS" = "200" ] && [ "$BS_STATUS" = "200" ]; then
                echo "StorageClass and BackingStore already exist. ODF or NooBaa is present."
                patch_noobaa_resources
                exit 0
              fi

              if [ "$SC_STATUS" = "200" ] && [ "$BS_STATUS" != "200" ]; then
                echo "StorageClass exists but BackingStore is missing. Creating it..."
                curl -s --cacert "$CACERT" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST "${API_SERVER}/apis/noobaa.io/v1alpha1/namespaces/${NAMESPACE}/backingstores" \
                  -d '{
                    "apiVersion": "noobaa.io/v1alpha1",
                    "kind": "BackingStore",
                    "metadata": {
                      "name": "noobaa-default-backing-store",
                      "namespace": "'"$NAMESPACE"'",
                      "labels": {"app": "noobaa"}
                    },
                    "spec": {
                      "type": "pv-pool",
                      "pvPool": {
                        "numVolumes": 1,
                        "resources": {
                          "requests": {"storage": "50Gi"}
                        }
                      }
                    }
                  }' | head -5
                echo "BackingStore created."
                patch_noobaa_resources
                exit 0
              fi

              echo "StorageClass $STORAGE_CLASS not found. Installing standalone NooBaa..."
              noobaa-operator install --mini --manual-default-backingstore --namespace "$NAMESPACE"

              echo "Creating PVPool default backing store..."
              curl -s --cacert "$CACERT" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "${API_SERVER}/apis/noobaa.io/v1alpha1/namespaces/${NAMESPACE}/backingstores" \
                -d '{
                  "apiVersion": "noobaa.io/v1alpha1",
                  "kind": "BackingStore",
                  "metadata": {
                    "name": "noobaa-default-backing-store",
                    "namespace": "'"$NAMESPACE"'",
                    "labels": {"app": "noobaa"}
                  },
                  "spec": {
                    "type": "pv-pool",
                    "pvPool": {
                      "numVolumes": 1,
                      "resources": {
                        "requests": {"storage": "50Gi"}
                      }
                    }
                  }
                }' | head -5

              echo "Waiting for NooBaa CR to be ready before patching resources..."
              for i in $(seq 1 30); do
                NB_STATUS=$(kube_get "/apis/noobaa.io/v1alpha1/namespaces/${NAMESPACE}/noobaas/noobaa")
                if [ "$NB_STATUS" = "200" ]; then break; fi
                echo "  Attempt ${i}/30: NooBaa CR not ready, waiting 10s..."
                sleep 10
              done
              patch_noobaa_resources
              echo "NooBaa installation complete."
