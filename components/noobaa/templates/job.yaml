---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noobaa-installer
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: noobaa-installer
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "secrets", "configmaps", "pods", "serviceaccounts", "persistentvolumeclaims", "endpoints", "events"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["noobaa.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["objectbucket.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["*"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["use", "get", "list", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noobaa-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noobaa-installer
subjects:
  - kind: ServiceAccount
    name: noobaa-installer
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: noobaa-installer
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: noobaa-installer
      restartPolicy: Never
      containers:
        - name: install
          image: {{ .Values.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              STORAGE_CLASS="openshift-storage.noobaa.io"
              NAMESPACE="{{ .Values.namespace }}"

              if kubectl get storageclass "$STORAGE_CLASS" >/dev/null 2>&1; then
                echo "StorageClass $STORAGE_CLASS already exists. ODF or NooBaa is present."
                exit 0
              fi

              echo "StorageClass $STORAGE_CLASS not found. Installing standalone NooBaa..."

              # Run install without waiting — noobaa install blocks on system ready
              # but CNPG needs SCC grants before it can start on OpenShift
              noobaa-operator install --mini --namespace "$NAMESPACE" &
              INSTALL_PID=$!

              # Wait for the CNPG service accounts to be created, then grant SCC
              echo "Waiting for CNPG and NooBaa service accounts..."
              for i in $(seq 1 60); do
                if kubectl get sa cnpg-manager -n "$NAMESPACE" >/dev/null 2>&1; then
                  echo "Granting SCC to service accounts..."
                  kubectl adm policy add-scc-to-user nonroot-v2 -z cnpg-manager -n "$NAMESPACE" || true
                  kubectl adm policy add-scc-to-user nonroot-v2 -z noobaa -n "$NAMESPACE" || true
                  kubectl adm policy add-scc-to-user nonroot-v2 -z noobaa-endpoint -n "$NAMESPACE" || true
                  kubectl adm policy add-scc-to-user nonroot-v2 -z noobaa-core -n "$NAMESPACE" || true
                  # Restart CNPG to pick up the SCC
                  kubectl rollout restart deployment/cnpg-controller-manager -n "$NAMESPACE" || true
                  break
                fi
                sleep 5
              done

              # Wait for install to finish
              wait $INSTALL_PID || true

              echo "Waiting for StorageClass $STORAGE_CLASS to become available..."
              TIMEOUT=600
              INTERVAL=10
              ELAPSED=0
              while [ $ELAPSED -lt $TIMEOUT ]; do
                if kubectl get storageclass "$STORAGE_CLASS" >/dev/null 2>&1; then
                  echo "StorageClass $STORAGE_CLASS is now available."
                  exit 0
                fi
                echo "Still waiting... (${ELAPSED}s elapsed)"
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
              done

              echo "ERROR: Timed out waiting for StorageClass $STORAGE_CLASS after ${TIMEOUT}s"
              exit 1
