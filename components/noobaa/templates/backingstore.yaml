apiVersion: noobaa.io/v1alpha1
kind: BackingStore
metadata:
  name: noobaa-default-backing-store
  namespace: {{ .Values.namespace }}
  labels:
    app: noobaa
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: pv-pool
  pvPool:
    numVolumes: 1
    resources:
      requests:
        storage: 50Gi
