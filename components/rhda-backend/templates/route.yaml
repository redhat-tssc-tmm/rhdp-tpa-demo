---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhda-backend
  labels:
    app: rhda-backend
spec:
  {{- if .Values.routeHost }}
  host: {{ .Values.routeHost }}
  {{- end }}
  to:
    kind: Service
    name: rhda-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
